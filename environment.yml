name: travel-agent
channels:
  - defaults

dependencies:
  - python=3.11
  - pip>=24.0
  - pip:
      #orchestration part
      - langgraph==1.2.11                   #graph runtime
      - langgraph-checkpoint==4.2.0         #check pointer
      - langgraph-checkpoint-sqlite==3.1.1  
      - langchain-core==1.5.6               # AI Message types

      #LLM providers 
      - langchain-groq==1.1.3               
      - langchain-anthropic==1.5.6         
      - langchain-openai==1.5.2        

      #schemas and the configuration 
      - pydantic==2.13.4                    
      - pydantic-settings==2.15.0          

      #retrieval 
      - faiss-cpu==1.15.0                   #vector index 
      - numpy==2.3.5                        #vectors and the fallback store

      # io 
      - httpx==0.28.1                       #async HTTP with real timeouts
      - ddgs==9.15.0                        #live web search

      #UI
      - streamlit==1.61.1                  
      - plotly==6.9.0                   
      - pandas==3.0.5                  

      #quality gates 
      - pytest==9.1.1
      - pytest-asyncio==1.4.0
      - pytest-cov==7.0.0
      - ruff==0.16.3
      - black==26.5.1
      - mypy==2.3.1
      - pre-commit==4.6.2
