name: CI

# The whole point of this workflow is that it runs with no secrets configured.
# If it passes, the application genuinely works without API keys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint and test (no API keys)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the environment
        run: python scripts/smoke_test.py

      - name: Lint
        run: ruff check src tests scripts evals

      - name: Check formatting
        run: black --check src tests scripts evals

      # Non-gating on purpose. The remaining errors are all friction with
      # third-party stubs - langchain's message union, ChatGroq's aliased model
      # argument, numpy returning Any - rather than defects in this code. Failing
      # the build on someone else's type stubs would make the signal worthless.
      - name: Type-check the application (informational)
        run: mypy src
        continue-on-error: true

      - name: Seed the vector store
        run: python scripts/seed_vectorstore.py

      - name: Run the test suite
        env:
          # Blanked explicitly. Environment variables take precedence over .env,
          # so this guarantees the suite is exercising the mock providers even if
          # a key ever reaches the runner.
          GROQ_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          LLM_PROVIDER: ""
        run: pytest -q

      - name: Evaluate the router
        env:
          GROQ_API_KEY: ""
          LLM_PROVIDER: ""
        run: python evals/run_eval.py
