[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "1.0.0"
description = "Multi-modal travel assistant built on a LangGraph state machine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath keeps the suite runnable even without `pip install -e .`
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits a real third-party API; skipped automatically when the key is absent",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "D"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test doubles implement provider interfaces and must keep their signatures
# even when a stub ignores the arguments.
"tests/*" = ["D101", "D102", "D103", "D100", "D107", "ARG001", "ARG002", "ARG005"]
# LangGraph node callables must accept `state` even when they ignore it.
"scripts/*" = ["D103", "ARG001", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
